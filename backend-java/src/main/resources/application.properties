spring.application.name=invoiceapp
server.port=8080

spring.datasource.url=jdbc:h2:mem:invoiceapp;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.open-in-view=false

app.users[0].username=demo.approver
app.users[0].password=ChangeMe123!
app.users[0].role=Approver
app.users[1].username=demo.admin
app.users[1].password=ChangeMe123!
app.users[1].role=Admin
